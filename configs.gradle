ext {
    application = [
            versionCode  : 32,
            versionName  : "1.32",
            applicationId: "br.com.policlinsaude"
    ]

    versions = [
            buildTools: "29.0.3",
            minSdk    : 21,
            targetSdk : 29,
            compileSdk: 29,
    ]

    supportVersion = '27.1.1'
    daggerVersion = '2.16'
    rxVersion = '2.1.9'
    rxkotlinVersion = '2.1.0'
    kotlinVersion = '1.3.10'
    realmVersion = '4.3.3'
    rxAndroidVersion = "2.0.1"
    gradleVersion = "3.0.1"
    constraintLayouVersion = '1.0.2'
    lifecycle = '1.0.0'
    retrofitVersion = '2.3.0'
    loggingInterceptorVersion = '3.8.0'
    gsonVersion = '2.8.2'
    materialStepperVersion = '4.3.1'
    awesomeValidationVersion = '4.0'
    pageIndicatorViewVersion = '1.0.0'
    inputMaskVersion = '2.3.0'
    multidexVersion = '1.0.0'
    usefulviewsVersion = '2.3.6'
    circleImageViewVersion = '2.2.0'
    flexBoxLayoutVersion = '0.3.2'
    servicesVersion = '18.0.0'
    reactiveLocationVersion = '2.1@aar'
    dexterVersion = '4.2.0'
    easyImageVersion = '1.3.1'
    glideVersion = '4.6.1'
    navigation_version = "2.3.5"
    koin_version = "2.2.3"

    dependencies = [
            dagger2                  : "com.google.dagger:dagger:$daggerVersion",
            dagger2_android          : "com.google.dagger:dagger-android:$daggerVersion",
            dagger2_android_support  : "com.google.dagger:dagger-android-support:$daggerVersion",
            dagger2_compiler         : "com.google.dagger:dagger-compiler:$daggerVersion",
            dagger2_android_processor: "com.google.dagger:dagger-android-processor:$daggerVersion",

            rx_java                  : "io.reactivex.rxjava2:rxjava:$rxVersion",
            rx_android               : "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion",
            rx_kotlin                : "io.reactivex.rxjava2:rxkotlin:$rxkotlinVersion",

            kotlin_std_lib           : "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion",

            app_compat               : 'androidx.appcompat:appcompat:1.0.0',
            card_view                : 'androidx.cardview:cardview:1.0.0',
            constraint_layout        : 'androidx.constraintlayout:constraintlayout:1.1.3',
            support_design           : 'com.google.android.material:material:1.0.0',
            support_annotations      : 'androidx.annotation:annotation:1.0.0',
            recycler_view            : 'androidx.recyclerview:recyclerview:1.0.0',
            material_stepper         : "com.stepstone.stepper:material-stepper:$materialStepperVersion",
            awesome_validation       : "com.basgeekball:awesome-validation:$awesomeValidationVersion",
            page_indicator_view      : "com.romandanylyk:pageindicatorview:$pageIndicatorViewVersion",
            input_mask               : "com.redmadrobot:inputmask:$inputMaskVersion",
            material_spinner         : "com.satsuware.lib:usefulviews:$usefulviewsVersion",

            multidex                 : 'androidx.multidex:multidex:2.0.0',


            arch_lifecycle_extensions: "android.arch.lifecycle:extensions:$lifecycle",
            arch_lifecycle_compiler  : "android.arch.lifecycle:compiler:$lifecycle",

            retrofit                 : "com.squareup.retrofit2:retrofit:$retrofitVersion",
            retrofit_adapter_rxjava  : "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion",
            retrofit_converter_gson  : "com.squareup.retrofit2:converter-gson:$retrofitVersion",
            logging_interceptor      : "com.squareup.okhttp3:logging-interceptor:$loggingInterceptorVersion",
            gson                     : "com.google.code.gson:gson:$gsonVersion",

            circle_image_view        : "de.hdodenhof:circleimageview:$circleImageViewVersion",
            flex_box_layout          : "com.google.android:flexbox:$flexBoxLayoutVersion",

            google_location          : "com.google.android.gms:play-services-location:$servicesVersion",
            reactive_location        : "pl.charmas.android:android-reactive-location2:$reactiveLocationVersion",

            dexter                   : "com.karumi:dexter:$dexterVersion",

            easy_image               : "com.github.jkwiecien:EasyImage:$easyImageVersion",
            glide                    : "com.github.bumptech.glide:glide:$glideVersion",
            glide_compiler           : "com.github.bumptech.glide:compiler:$glideVersion",

            google_maps              : "com.google.android.gms:play-services-maps:$servicesVersion"
    ]

    testDependencies = [
            junit        : "junit:junit:4.12",
            mockito      : "org.mockito:mockito-core:2.8.47",
            kakao        : "com.agoda.kakao:kakao:1.2.0",
            mockitoKotlin: "com.nhaarman:mockito-kotlin:1.5.0",
            roboletric   : "org.robolectric:robolectric:3.4.2",
            expresso_core: "com.android.support.test.espresso:espresso-core:3.0.1",
            core_testing : "android.arch.core:core-testing:$lifecycle"
    ]
}