ext {
    application = [
            versionCode  : 61,
            versionName  : "1.60.10",
            applicationId: "br.com.policlinsaude"
    ]

    versions = [
            buildTools: "34.0.0",
            minSdk    : 24,
            targetSdk : 34,
            compileSdk: 34,
    ]

    // Core versions
    kotlinVersion = '1.9.20'
    
    // AndroidX versions
    lifecycleVersion = '2.6.2'
    navigation_version = "2.7.5"
    constraintLayoutVersion = '2.1.4'
    
    // Networking
    retrofitVersion = '2.10.0'
    loggingInterceptorVersion = '4.11.0'
    gsonVersion = '2.10.1'
    
    // Reactive
    rxVersion = '2.2.20'
    rxkotlinVersion = '2.4.0'
    rxAndroidVersion = "2.1.1"
    
    // UI Libraries
    glideVersion = '4.16.0'
    circleImageViewVersion = '3.1.0'
    flexBoxLayoutVersion = '3.0.0'
    materialVersion = '1.10.0'
    
    // Location & Maps
    servicesVersion = '18.0.0'
    
    // Permissions
    dexterVersion = '6.2.3'
    
    // Image picking
    easyImageVersion = '1.3.1'
    
    // Validation
    awesomeValidationVersion = '4.0'
    
    // Other
    multidexVersion = '2.0.1'
    junitVersion = '4.13.2'
    coroutinesVersion = '1.7.3'

    dependencies = [
            // Reactive
            rx_java                  : "io.reactivex.rxjava2:rxjava:$rxVersion",
            rx_android               : "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion",
            rx_kotlin                : "io.reactivex.rxjava2:rxkotlin:$rxkotlinVersion",
            coroutines               : "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion",
            coroutines_android       : "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion",

            // Kotlin
            kotlin_std_lib           : "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion",

            // AndroidX
            app_compat               : 'androidx.appcompat:appcompat:1.6.1',
            card_view                : 'androidx.cardview:cardview:1.0.0',
            constraint_layout        : "androidx.constraintlayout:constraintlayout:$constraintLayoutVersion",
            support_design           : "com.google.android.material:material:$materialVersion",
            support_annotations      : 'androidx.annotation:annotation:1.7.0',
            recycler_view            : 'androidx.recyclerview:recyclerview:1.3.2',
            multidex                 : "androidx.multidex:multidex:$multidexVersion",

            // Lifecycle
            lifecycle_runtime        : "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion",
            lifecycle_viewmodel      : "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion",
            lifecycle_livedata       : "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion",
            lifecycle_compiler       : "androidx.lifecycle:lifecycle-compiler:$lifecycleVersion",

            // Navigation
            navigation_fragment      : "androidx.navigation:navigation-fragment-ktx:$navigation_version",
            navigation_ui            : "androidx.navigation:navigation-ui-ktx:$navigation_version",

            // Networking
            retrofit                 : "com.squareup.retrofit2:retrofit:$retrofitVersion",
            retrofit_adapter_rxjava  : "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion",
            retrofit_converter_gson  : "com.squareup.retrofit2:converter-gson:$retrofitVersion",
            logging_interceptor      : "com.squareup.okhttp3:logging-interceptor:$loggingInterceptorVersion",
            gson                     : "com.google.code.gson:gson:$gsonVersion",

            // Image loading
            glide                    : "com.github.bumptech.glide:glide:$glideVersion",
            glide_compiler           : "com.github.bumptech.glide:compiler:$glideVersion",
            circle_image_view        : "de.hdodenhof:circleimageview:$circleImageViewVersion",
            
            // UI
            flex_box_layout          : "com.google.android.flexbox:flexbox:$flexBoxLayoutVersion",
            awesome_validation       : "com.basgeekball:awesome-validation:$awesomeValidationVersion",


            // Location & Maps
            google_location          : "com.google.android.gms:play-services-location:$servicesVersion",
            google_maps              : "com.google.android.gms:play-services-maps:$servicesVersion",

            // Permissions
            dexter                   : "com.karumi:dexter:$dexterVersion",

            // Image picking
            easy_image               : "com.github.jkwiecien:EasyImage:$easyImageVersion",
            
            // Testing
            junit                    : "junit:junit:$junitVersion",
            mockito                  : "org.mockito:mockito-core:5.6.0",
            mockito_kotlin           : "org.mockito.kotlin:mockito-kotlin:5.1.0"
    ]
}