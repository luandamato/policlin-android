plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

HashMap<String, String> baseDependencies = rootProject.ext.dependencies
HashMap<String, String> application = rootProject.ext.application
HashMap<String, String> versions = rootProject.ext.versions

android {
    compileSdk versions.compileSdk
    buildToolsVersion versions.buildTools
    namespace "br.com.policlinsaude"

    signingConfigs {
        config {
            storeFile file(RELEASE_STORE_FILE)
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            storePassword RELEASE_STORE_PASSWORD

            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId application.applicationId
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionName application.versionName
        versionCode application.versionCode

        multiDexEnabled true

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            multiDexEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            zipAlignEnabled true
            versionNameSuffix '.0'
        }

        debug {
            signingConfig signingConfigs.config
            proguardFile 'proguard-rules.pro'
            zipAlignEnabled true
            versionNameSuffix '.0'
        }
    }

    productFlavors {}

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    // Kotlin
    implementation baseDependencies.kotlin_std_lib
    implementation baseDependencies.coroutines
    implementation baseDependencies.coroutines_android

    // AndroidX & Material
    implementation baseDependencies.app_compat
    implementation baseDependencies.card_view
    implementation baseDependencies.constraint_layout
    implementation baseDependencies.support_design
    implementation baseDependencies.support_annotations
    implementation baseDependencies.recycler_view
    implementation baseDependencies.multidex

    // Lifecycle & MVVM
    implementation baseDependencies.lifecycle_runtime
    implementation baseDependencies.lifecycle_viewmodel
    implementation baseDependencies.lifecycle_livedata

    // Navigation
    implementation baseDependencies.navigation_fragment
    implementation baseDependencies.navigation_ui

    // Networking
    implementation baseDependencies.retrofit
    implementation baseDependencies.retrofit_adapter_rxjava
    implementation baseDependencies.retrofit_converter_gson
    implementation baseDependencies.logging_interceptor
    implementation baseDependencies.gson

    // Reactive
    implementation baseDependencies.rx_java
    implementation baseDependencies.rx_android
    implementation baseDependencies.rx_kotlin

    // Database
//    implementation baseDependencies.room_runtime
//    kapt baseDependencies.room_compiler
//    implementation baseDependencies.room_ktx

    // Image Loading
    implementation baseDependencies.glide
    implementation baseDependencies.circle_image_view

    // UI Libraries
    implementation baseDependencies.flex_box_layout
    implementation baseDependencies.awesome_validation

    implementation 'com.github.arcadefire:nice-spinner:1.3.1'

    // Location & Maps
    implementation baseDependencies.google_location
    implementation baseDependencies.google_maps

    // Permissions
    implementation baseDependencies.dexter

    // Image Picking
    implementation baseDependencies.easy_image

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    // Testing
    testImplementation baseDependencies.junit
    testImplementation baseDependencies.mockito
    testImplementation baseDependencies.mockito_kotlin
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}