apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'

HashMap<String, String> baseDependencies = rootProject.ext.dependencies
HashMap<String, String> application = rootProject.ext.application
HashMap<String, String> versions = rootProject.ext.versions

android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools

    signingConfigs {
        config {
            storeFile file(RELEASE_STORE_FILE)
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            storePassword RELEASE_STORE_PASSWORD

            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId application.applicationId
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk
        versionCode application.versionCode
        versionName application.versionName

        multiDexEnabled true

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            multiDexEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            zipAlignEnabled true
            versionNameSuffix '1.1'
        }

        debug {
            signingConfig signingConfigs.config
            proguardFile 'proguard-rules.pro'
            zipAlignEnabled true
            versionNameSuffix '1.1'
        }
    }

    productFlavors {}

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


kapt {
    generateStubs = true
}

dependencies {
    api project(':domain')
    api project(':data')
    implementation baseDependencies.recycler_view
    implementation baseDependencies.kotlin_std_lib
    implementation baseDependencies.dagger2
    implementation baseDependencies.dagger2_android_support
    kapt baseDependencies.dagger2_compiler
    kapt baseDependencies.dagger2_android_processor
    implementation baseDependencies.rx_java
    implementation baseDependencies.rx_android
    implementation baseDependencies.rx_kotlin
    implementation baseDependencies.app_compat
    implementation baseDependencies.card_view
    implementation baseDependencies.constraint_layout
    implementation baseDependencies.support_design
    implementation baseDependencies.support_annotations
    implementation baseDependencies.material_stepper
    implementation baseDependencies.awesome_validation
    implementation baseDependencies.page_indicator_view
    implementation baseDependencies.input_mask
    implementation baseDependencies.circle_image_view
    implementation baseDependencies.flex_box_layout
    implementation baseDependencies.google_location
    implementation baseDependencies.reactive_location
    implementation baseDependencies.dexter
    implementation baseDependencies.easy_image
    implementation baseDependencies.glide
    implementation baseDependencies.google_maps
    annotationProcessor baseDependencies.glide_compiler
    implementation 'com.github.arcadefire:nice-spinner:1.3.1'
    implementation baseDependencies.multidex
    implementation baseDependencies.multidex
    implementation 'com.google.code.gson:gson:2.8.2'
    implementation platform('com.google.firebase:firebase-bom:30.0.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}


