plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'

    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'br.com.policlinsaude'

    compileSdk 36

    defaultConfig {
        applicationId 'br.com.policlinsaude'

        minSdk 23
        targetSdk 35

        versionCode 61
        versionName "2.0"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        config {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                storePassword RELEASE_STORE_PASSWORD
            }

            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            multiDexEnabled true
            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )

            if (signingConfigs.config.storeFile != null) {
                signingConfig signingConfigs.config
            }

            zipAlignEnabled true
        }

        debug {
            if (signingConfigs.config.storeFile != null) {
                signingConfig signingConfigs.config
            }

            proguardFile 'proguard-rules.pro'
            zipAlignEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                    '/META-INF/{AL2.0,LGPL2.1}'
            ]
        }
    }
}

kotlin {
    jvmToolchain(17)

    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

kapt {
    correctErrorTypes true
}

dependencies {

    // ============================================================
    // KOTLIN
    // ============================================================

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'


    // ============================================================
    // ANDROIDX
    // ============================================================

    implementation 'androidx.core:core-ktx:1.17.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation 'androidx.activity:activity:1.10.1'

    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'androidx.browser:browser:1.9.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'androidx.viewpager2:viewpager2:1.1.0'


    // ============================================================
    // LIFECYCLE
    // ============================================================

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.3'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.3'

    kapt 'androidx.lifecycle:lifecycle-compiler:2.9.3'


    // ============================================================
    // NAVIGATION
    // ============================================================

    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.3'

    implementation 'androidx.navigation:navigation-ui-ktx:2.9.3'


    // ============================================================
    // DAGGER
    // ============================================================

    implementation 'com.google.dagger:dagger:2.57.1'

    implementation 'com.google.dagger:dagger-android:2.57.1'

    implementation 'com.google.dagger:dagger-android-support:2.57.1'

    kapt 'com.google.dagger:dagger-compiler:2.57.1'

    kapt 'com.google.dagger:dagger-android-processor:2.57.1'


    // ============================================================
    // RXJAVA
    // ============================================================

    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'


    // ============================================================
    // RETROFIT / NETWORK
    // ============================================================

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'

    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.11.0'

    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.google.code.gson:gson:2.13.1'


    // ============================================================
    // GLIDE
    // ============================================================

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    kapt 'com.github.bumptech.glide:compiler:4.16.0'


    // ============================================================
    // GOOGLE / LOCATION / MAPS
    // ============================================================

    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation 'com.google.android.gms:play-services-maps:19.2.0'

    implementation 'com.karumi:dexter:6.2.3'


    // ============================================================
    // FIREBASE
    // ============================================================

    implementation platform('com.google.firebase:firebase-bom:34.0.0')

    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.google.firebase:firebase-messaging'


    // ============================================================
    // KOIN
    // ============================================================

    implementation 'io.insert-koin:koin-android:4.1.0'


    // ============================================================
    // MATERIAL / UI
    // ============================================================

    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    implementation 'com.github.romandanylyk:PageIndicatorView:1.0.1'

    // ============================================================
    // VALIDATION
    // ============================================================

    implementation 'com.basgeekball:awesome-validation:4.3'
    implementation 'com.redmadrobot:input-mask-android:7.2.4'


    // ============================================================
    // CIRCULAR IMAGE VIEW
    // ============================================================

    implementation 'com.mikhaellopez:circularimageview:4.3.1'


    // ============================================================
    // OUTRAS BIBLIOTECAS EXISTENTES
    // ============================================================

    implementation 'com.github.arcadefire:nice-spinner:1.4.4'

    implementation 'com.github.barteksc:pdfium-android:1.9.0'

    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    // ============================================================
    // TESTES
    // ============================================================

    testImplementation 'junit:junit:4.13.2'

    testImplementation 'org.mockito:mockito-core:5.18.0'

    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'

    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    testImplementation 'org.robolectric:robolectric:4.14.1'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
